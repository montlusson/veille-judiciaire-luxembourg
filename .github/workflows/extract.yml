name: Extraction hebdomadaire des décisions

on:
  schedule:
    # Chaque dimanche à 4h UTC (6h Luxembourg)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    # Déclenchement manuel depuis l'onglet Actions de GitHub

jobs:
  extract:
    name: Extraire et pousser vers Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install pdfplumber requests beautifulsoup4

      # Les données ne sont plus commitées dans le repo public :
      # elles partent vers Supabase (lecture réservée @reporter.lu).
      - name: Lancer l'extraction (nouvelles décisions → Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lhtkvogmkebslihuwfyu.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE }}
        run: python extract_decisions.py --push-new

      - name: Scraper les audiences (blobs → Supabase)
        if: always()   # tourne même si l'extraction des décisions a échoué
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lhtkvogmkebslihuwfyu.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE }}
        run: python scrape_audiences.py || true

      # Seul le cache d'URLs est committé (URLs publiques data.public.lu,
      # nécessaire à l'extraction incrémentale entre deux runs CI). Le push est
      # retenté avec rebase : un simple "|| true" masquait un rejet ponctuel de
      # GitHub (ex. "fatal error in commit_refs" du 2026-09-13) sans que
      # personne ne s'en aperçoive — le run restait "success" malgré tout.
      - name: Committer le cache d'extraction
        if: always()   # évite de re-télécharger les mêmes archives au run suivant
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zip_cache.json || true
          git diff --cached --quiet || git commit -m "chore: cache extraction $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            if git push; then
              echo "✓ Cache poussé (tentative $attempt)"
              exit 0
            fi
            echo "✗ Push échoué (tentative $attempt/3) — rebase sur origin/main et nouvel essai"
            sleep $((attempt * 5))
            git pull --rebase origin main || true
          done
          echo "::warning::Le cache d'extraction n'a pas pu être poussé après 3 tentatives — sans impact sur les données (déjà envoyées à Supabase), mais l'extraction incrémentale re-téléchargera davantage d'archives au prochain run."
