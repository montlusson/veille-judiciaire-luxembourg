name: Keep-alive Supabase

# Les projets Supabase gratuits sont mis en pause après ~7 jours d'inactivité.
# Ce job écrit chaque jour dans la table `meta` pour réinitialiser le compteur
# d'inactivité et empêcher la mise en veille (sinon le site et l'extraction
# hebdomadaire tombent en panne). Un simple SELECT anonyme ne suffisait pas
# à être compté comme activité par Supabase : on fait donc un upsert (écriture
# réelle) avec la clé service_role, déjà utilisée par extract.yml.

on:
  schedule:
    - cron: '17 5 * * *'   # tous les jours à 5h17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Écrire dans Supabase (garde le projet actif)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE }}
        run: |
          URL="https://lhtkvogmkebslihuwfyu.supabase.co/rest/v1/meta?on_conflict=key"
          CODE=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$URL" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"key":"keepalive","value":"'"$(date -u +%FT%TZ)"'"}')
          echo "Supabase a répondu HTTP $CODE"
          # 201/200 = écriture réussie. 000 = injoignable (projet en pause →
          # à restaurer manuellement dans le dashboard). On échoue pour alerter.
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::Écriture Supabase échouée (HTTP $CODE) — projet peut-être en pause. Restaurez-le dans le dashboard."
            exit 1
          fi
